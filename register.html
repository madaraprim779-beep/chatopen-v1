<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Créer un compte - ChatOpen</title>

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <main class="auth">

    <div class="card">

      <div class="logo small">C</div>

      <h1>Créer un compte</h1>

      <p class="muted">
        Rejoins ChatOpen en quelques secondes.
      </p>

      <form id="registerForm">

        <input
          id="username"
          type="text"
          placeholder="Nom d'utilisateur"
          maxlength="24"
          autocomplete="username"
          required
        >

        <input
          id="password"
          type="password"
          placeholder="Mot de passe"
          minlength="6"
          autocomplete="new-password"
          required
        >

        <input
          id="confirm"
          type="password"
          placeholder="Confirmer le mot de passe"
          minlength="6"
          autocomplete="new-password"
          required
        >

        <button
          id="registerButton"
          class="btn full"
          type="submit"
        >
          Créer mon compte
        </button>

        <p id="error" class="error"></p>

      </form>

      <p class="bottom-text">
        Déjà un compte ?
        <a href="login.html">Se connecter</a>
      </p>

    </div>

  </main>

  <script type="module" src="js/register.js"></script>

</body>

</html>
