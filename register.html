<!DOCTYPE html><html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Créer un compte — ChatOpen</title>
  <link rel="stylesheet" href="style.css">
</head><body class="auth-page">  <main class="auth-container"><div class="auth-logo">
  <div class="logo-circle">C</div>
  <h1>ChatOpen</h1>
  <p>Discutez simplement avec vos proches.</p>
</div>

<section class="auth-card">

  <h2>Créer votre compte</h2>
  <p class="auth-subtitle">
    Rejoignez ChatOpen gratuitement
  </p>

  <form id="registerForm">

    <div class="input-group">
      <label for="name">Nom d'utilisateur</label>
      <input
        type="text"
        id="name"
        placeholder="Votre nom"
        autocomplete="username"
        required
      >
    </div>

    <div class="input-group">
      <label for="password">Mot de passe</label>
      <input
        type="password"
        id="password"
        placeholder="Créer un mot de passe"
        autocomplete="new-password"
        minlength="6"
        required
      >
    </div>

    <div class="input-group">
      <label for="confirmPassword">Confirmer le mot de passe</label>
      <input
        type="password"
        id="confirmPassword"
        placeholder="Confirmer votre mot de passe"
        autocomplete="new-password"
        minlength="6"
        required
      >
    </div>

    <p id="registerMessage" class="form-message"></p>

    <button type="submit" class="auth-button">
      Créer mon compte
    </button>

  </form>

  <div class="auth-footer">
    <span>Vous avez déjà un compte ?</span>
    <a href="index.html">Se connecter</a>
  </div>

</section>

  </main>  <script type="module" src="js/auth.js"></script></body>
</html>
