<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Créer un compte - ChatOpen</title>

    <link rel="stylesheet" href="CSS/style.css">
</head>

<body>

    <main class="auth-container">

        <div class="auth-box">

            <div class="logo">
                💬 ChatOpen
            </div>

            <h1>Créer un compte</h1>

            <p>Crée ton compte ChatOpen</p>

            <form id="registerForm">

                <label for="username">
                    Nom d'utilisateur
                </label>

                <input
                    type="text"
                    id="username"
                    placeholder="Entre ton nom"
                    autocomplete="username"
                    required
                >

                <label for="password">
                    Mot de passe
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Crée ton mot de passe"
                    autocomplete="new-password"
                    minlength="6"
                    required
                >

                <label for="confirm-password">
                    Confirmer le mot de passe
                </label>

                <input
                    type="password"
                    id="confirm-password"
                    placeholder="Confirme ton mot de passe"
                    autocomplete="new-password"
                    minlength="6"
                    required
                >

                <button type="submit">
                    Créer mon compte
                </button>

            </form>

            <div id="accountCreated" class="account-created">
                <h2>🎉 Compte créé !</h2>

                <p>Ton numéro ChatOpen :</p>

                <strong id="chatopenNumber">
                    ---
                </strong>

                <p>
                    Garde ce numéro pour que tes amis
                    puissent te retrouver.
                </p>

                <a href="login.html">
                    Se connecter
                </a>
            </div>

            <p class="auth-link">
                Tu as déjà un compte ?
                <a href="login.html">
                    Se connecter
                </a>
            </p>

            <a href="index.html" class="back-link">
                ← Retour à l'accueil
            </a>

        </div>

    </main>

    <script src="JS/app.js"></script>

</body>
</html>
