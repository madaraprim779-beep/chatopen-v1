<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Créer un compte — ChatOpen</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="welcome">

        <div class="logo">💬</div>

        <h1>Créer un compte</h1>

        <p>Rejoins ChatOpen</p>

        <form id="registerForm" class="buttons">

            <input
                type="text"
                id="username"
                placeholder="Nom d'utilisateur"
                required
            >

            <input
                type="email"
                id="email"
                placeholder="Adresse e-mail"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Mot de passe"
                required
            >

            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirmer le mot de passe"
                required
            >

            <button type="submit" class="btn register">
                Créer mon compte
            </button>

        </form>

        <p>
            Tu as déjà un compte ?
            <a href="login.html">Se connecter</a>
        </p>

    </div>

    <script src="js/auth.js"></script>

</body>
</html>
