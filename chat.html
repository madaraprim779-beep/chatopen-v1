<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChatOpen</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <div class="chat-app">

    <header class="topbar">
      <div>
        <h2>ChatOpen</h2>
        <span id="myId">ID : chargement...</span>
      </div>

      <div class="top-actions">
        <button onclick="location.href='profils.html'">👤</button>
        <button onclick="location.href='settings.html'">⚙️</button>
      </div>
    </header>

    <div class="search-box">
      <input
        id="search"
        type="text"
        placeholder="Rechercher..."
      >
    </div>

    <section id="conversationList">
      <div class="empty">
        <h3>Aucune discussion</h3>
        <p>Commence une nouvelle conversation.</p>
      </div>
    </section>

    <button id="newChat" class="new-chat">+</button>

  </div>

  <script type="module" src="js/chat.js"></script>

</body>
</html>
