<!DOCTYPE html><html lang="fr"><head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">  <title>ChatOpen</title>  <link rel="stylesheet" href="style.css">
</head><body><div class="chat-app">  <!-- ================= HEADER ================= -->  <header class="chat-topbar"><button
  id="backButton"
  class="icon-btn"
  type="button"
  aria-label="Retour">
  ‹
</button>

<div class="conversation-user">

  <div
    id="chatUserAvatar"
    class="conversation-avatar">
    ?
  </div>

  <div class="conversation-details">

    <strong id="chatUserName">
      Conversation
    </strong>

    <span id="chatUserNumber">
    </span>

  </div>

</div>

<div class="topbar-actions">

  <button
    id="audioCallButton"
    class="icon-btn"
    type="button"
    aria-label="Appel vocal">
    <span>☎</span>
  </button>

  <button
    id="videoCallButton"
    class="icon-btn"
    type="button"
    aria-label="Appel vidéo">
    <span>▣</span>
  </button>

  <button
    id="themeButton"
    class="icon-btn"
    type="button"
    aria-label="Thème">
    <span>◐</span>
  </button>

</div>

  </header>  <!-- ================= CHAT ================= -->  <main
    id="messagesContainer"
    class="messages"><div
  id="emptyChat"
  class="empty-conversation">

  <div class="empty-icon">
    💬
  </div>

  <strong>
    Aucun message
  </strong>

  <span>
    Commencez la conversation.
  </span>

</div>

  </main>  <!-- ================= EMOJI PANEL ================= -->  <section
    id="emojiPanel"
    class="emoji-panel"
    hidden><div
  id="emojiCategories"
  class="emoji-tabs">
</div>

<div
  id="emojiGrid"
  class="emoji-grid">
</div>

  </section>  <!-- ================= COMPOSER ================= -->  <form
    id="messageForm"
    class="composer"><button
  id="emojiButton"
  class="composer-icon"
  type="button"
  aria-label="Emojis">
  ☺
</button>

<input
  id="messageInput"
  type="text"
  placeholder="Message"
  autocomplete="off"
  maxlength="5000">

<button
  id="sendButton"
  class="send-btn"
  type="submit"
  aria-label="Envoyer">
  ↑
</button>

  </form></div><!-- ================= THEME ================= --><div
  id="themeModal"
  class="modal-overlay hidden">  <section class="theme-sheet"><div class="sheet-header">

  <div>
    <strong>Thème</strong>
    <span>Personnalisez cette conversation</span>
  </div>

  <button
    id="closeThemeButton"
    class="sheet-close"
    type="button">
    ×
  </button>

</div>

<div
  id="themeList"
  class="theme-list">
</div>

  </section></div><!-- ================= APPEL ================= --><div
  id="callModal"
  class="call-modal hidden"><video
id="remoteVideo"
class="remote-video"
autoplay
playsinline>
</video>

<video
id="localVideo"
class="local-video"
autoplay
muted
playsinline>
</video>

  <div class="call-info"><strong id="callTitle">
  Appel
</strong>

<span id="callStatus">
  Connexion...
</span>

  </div>  <div class="call-actions"><button
  id="acceptCallButton"
  class="call-btn accept"
  type="button">
  ✓
</button>

<button
  id="rejectCallButton"
  class="call-btn decline"
  type="button">
  ×
</button>

<button
  id="muteButton"
  class="call-btn"
  type="button">
  🎙
</button>

<button
  id="cameraButton"
  class="call-btn"
  type="button">
  ▣
</button>

<button
  id="endCallButton"
  class="call-btn decline"
  type="button">
  ☎
</button>

  </div></div><!-- ================= SCRIPTS ================= --><script type="module">

  import {
    CHATOPEN_EMOJI_CATEGORIES,
    getEmojisByCategory,
    createEmojiElement,
    insertEmoji
  } from "./js/emoji.js";

  import {
    startCall,
    listenForIncomingCalls
  } from "./js/calls.js";


  /* ---------- EMOJIS ---------- */

  const emojiButton =
    document.getElementById("emojiButton");

  const emojiPanel =
    document.getElementById("emojiPanel");

  const emojiCategories =
    document.getElementById("emojiCategories");

  const emojiGrid =
    document.getElementById("emojiGrid");

  const messageInput =
    document.getElementById("messageInput");


  function showEmojiCategory(category) {

    emojiGrid.innerHTML = "";

    getEmojisByCategory(category)
      .forEach((emoji) => {

        const button =
          document.createElement("button");

        button.type = "button";

        button.className =
          "emoji-item";

        button.appendChild(
          createEmojiElement(emoji)
        );

        button.addEventListener(
          "click",
          () => {

            insertEmoji(
              messageInput,
              emoji
            );

            messageInput.focus();

          }
        );

        emojiGrid.appendChild(button);

      });

  }


  CHATOPEN_EMOJI_CATEGORIES
    .forEach((category, index) => {

      const button =
        document.createElement("button");

      button.type = "button";

      button.className =
        "emoji-tab";

      button.textContent =
        category.name;

      button.addEventListener(
        "click",
        () => {

          showEmojiCategory(
            category.id
          );

        }
      );

      emojiCategories.appendChild(button);

      if (index === 0) {

        showEmojiCategory(
          category.id
        );

      }

    });


  emojiButton.addEventListener(
    "click",
    () => {

      emojiPanel.hidden =
        !emojiPanel.hidden;

    }
  );


  /* ---------- APPELS ---------- */

  const params =
    new URLSearchParams(
      window.location.search
    );

  const receiverId =
    params.get("user");


  document
    .getElementById("audioCallButton")
    ?.addEventListener(
      "click",
      async () => {

        if (!receiverId) return;

        try {

          await startCall(
            receiverId,
            "audio"
          );

        } catch (error) {

          console.error(error);

        }

      }
    );


  document
    .getElementById("videoCallButton")
    ?.addEventListener(
      "click",
      async () => {

        if (!receiverId) return;

        try {

          await startCall(
            receiverId,
            "video"
          );

        } catch (error) {

          console.error(error);

        }

      }
    );


  listenForIncomingCalls();

</script><script
  type="module"
  src="js/chat.js">
</script></body>
</html>
