<!DOCTYPE html><html lang="fr"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">  <title>ChatOpen</title>  <link rel="stylesheet" href="style.css">
</head><body>  <div class="chat-app"><!-- EN-TÊTE -->
<header class="chat-header">

  <button
    id="backButton"
    class="header-button"
    type="button"
    aria-label="Retour"
  >
    ←
  </button>

  <div class="chat-user">

    <div
      id="chatUserAvatar"
      class="chat-avatar"
    >
      ?
    </div>

    <div class="chat-user-info">
      <h2 id="chatUserName">Conversation</h2>
      <span id="chatUserNumber"></span>
    </div>

  </div>

  <button
    id="themeButton"
    class="header-button"
    type="button"
    aria-label="Changer le thème"
    title="Changer le thème"
  >
    🎨
  </button>

</header>


<!-- MESSAGES -->
<main
  id="messagesContainer"
  class="messages-container"
>

  <div
    id="emptyChat"
    class="empty-chat"
  >
    <div class="empty-chat-icon">
      💬
    </div>

    <h3>Bienvenue sur ChatOpen</h3>

    <p>
      Envoyez votre premier message.
    </p>
  </div>

</main>


<!-- ZONE D'ÉCRITURE -->
<form
  id="messageForm"
  class="message-form"
>

  <button
    type="button"
    id="emojiButton"
    class="message-action"
    aria-label="Emoji"
  >
    😊
  </button>

  <input
    type="text"
    id="messageInput"
    placeholder="Écrire un message..."
    autocomplete="off"
  >

  <button
    type="submit"
    id="sendButton"
    class="send-button"
    aria-label="Envoyer"
  >
    ➤
  </button>

</form>

  </div>  <!-- MODALE DES THÈMES -->  <div
    id="themeModal"
    class="theme-modal hidden"
  ><div class="theme-modal-content">

  <div class="theme-modal-header">

    <div>
      <h2>Thème de la conversation</h2>
      <p>Choisissez votre apparence</p>
    </div>

    <button
      id="closeThemeButton"
      class="close-theme-button"
      type="button"
    >
      ×
    </button>

  </div>


  <div
    id="themeList"
    class="theme-list"
  >
  </div>

</div>

  </div>  <!-- SCRIPT PRINCIPAL -->  <script type="module" src="js/chat.js"></script></body></html>
