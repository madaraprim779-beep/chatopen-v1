<!DOCTYPE html><html lang="fr"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">  <title>ChatOpen</title>  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="chat.css">
</head><body>  <div class="chat-app"><!-- HEADER -->
<header class="chat-header">

  <div class="header-left">

    <div class="my-avatar" id="myAvatar">
      <span id="myInitial">C</span>
    </div>

    <div class="header-title">
      <h1>ChatOpen</h1>
      <span id="myStatus">En ligne</span>
    </div>

  </div>

  <div class="header-actions">

    <button class="header-btn" id="searchButton">
      🔍
    </button>

    <button class="header-btn" id="menuButton">
      ⋮
    </button>

  </div>

</header>


<!-- BARRE DE RECHERCHE -->
<div class="chat-search" id="chatSearch">

  <div class="search-input-wrapper">

    <span>🔍</span>

    <input
      type="search"
      id="searchInput"
      placeholder="Rechercher une conversation"
      autocomplete="off"
    >

    <button id="closeSearch">×</button>

  </div>

</div>


<!-- TITRE -->
<div class="section-header">

  <h2>Discussions</h2>

  <button id="editButton">
    Modifier
  </button>

</div>


<!-- CONVERSATIONS -->
<main class="conversation-list" id="conversationList">

  <!-- Les conversations Firebase apparaîtront ici -->

  <div class="empty-chat" id="emptyChat">

    <div class="empty-chat-icon">
      💬
    </div>

    <h3>Bienvenue sur ChatOpen</h3>

    <p>
      Tes conversations apparaîtront ici.
      Commence une nouvelle discussion.
    </p>

  </div>

</main>


<!-- NOUVELLE DISCUSSION -->
<button
  class="new-chat-button"
  id="newChatButton"
  aria-label="Nouvelle discussion"
>
  <span>＋</span>
</button>


<!-- NAVIGATION -->
<nav class="bottom-navigation">

  <button class="bottom-item active">

    <span class="bottom-icon">💬</span>
    <span>Discussions</span>

  </button>

  <button class="bottom-item" id="contactsButton">

    <span class="bottom-icon">👥</span>
    <span>Contacts</span>

  </button>

  <button class="bottom-item" id="profileButton">

    <span class="bottom-icon">👤</span>
    <span>Profil</span>

  </button>

  <button class="bottom-item" id="settingsButton">

    <span class="bottom-icon">⚙️</span>
    <span>Réglages</span>

  </button>

</nav>


<!-- MENU LATÉRAL -->
<div class="menu-overlay" id="menuOverlay">

  <div class="side-menu">

    <button class="close-menu" id="closeMenu">
      ×
    </button>

    <div class="menu-profile">

      <div class="menu-avatar" id="menuAvatar">
        C
      </div>

      <h2 id="menuName">
        Utilisateur
      </h2>

      <span id="menuUsername">
        @chatopen
      </span>

    </div>


    <div class="menu-links">

      <button id="menuProfile">
        👤
        <span>Mon profil</span>
      </button>

      <button id="menuContacts">
        👥
        <span>Contacts</span>
      </button>

      <button id="menuThemes">
        🎨
        <span>Thème des discussions</span>
      </button>

      <button id="menuSettings">
        ⚙️
        <span>Réglages</span>
      </button>

      <button id="logoutButton" class="logout">
        ↪
        <span>Se déconnecter</span>
      </button>

    </div>

  </div>

</div>

  </div>  <script type="module" src="js/chat.js"></script></body></html>
