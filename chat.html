<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ChatOpen</title>

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <header class="topbar">

    <div class="brand">
      <div class="logo small">C</div>
      <span>ChatOpen</span>
    </div>

    <nav>
      <a href="profils.html">Profil</a>
      <a href="settings.html">Paramètres</a>
    </nav>

  </header>

  <main class="chat-layout">

    <aside class="users-panel">

      <h2>Discussions</h2>

      <input
        id="searchUser"
        type="text"
        placeholder="Rechercher..."
      >

      <div id="usersList">
        <p class="muted">Aucun utilisateur pour le moment.</p>
      </div>

    </aside>

    <section class="chat-panel">

      <div class="chat-header">
        <div>
          <h2 id="chatTitle">ChatOpen</h2>
          <p id="chatStatus" class="muted">
            Sélectionne une discussion
          </p>
        </div>
      </div>

      <div id="messages" class="messages">
        <div class="empty-chat">
          <div class="logo">C</div>
          <h2>Bienvenue sur ChatOpen</h2>
          <p class="muted">
            Sélectionne un utilisateur pour commencer une discussion.
          </p>
        </div>
      </div>

      <form id="messageForm" class="message-form">

        <input
          id="messageInput"
          type="text"
          placeholder="Écrire un message..."
          autocomplete="off"
          disabled
        >

        <button
          id="sendButton"
          class="btn"
          type="submit"
          disabled
        >
          Envoyer
        </button>

      </form>

    </section>

  </main>

  <script type="module" src="js/chat.js"></script>

</body>

</html>
