<!DOCTYPE html><html lang="fr"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">  <title>ChatOpen</title>  <link rel="stylesheet" href="style.css">
</head><body>  <div class="chatopen-app"><!-- HEADER -->
<header class="topbar">

  <div class="profile-area">

    <div class="avatar">
      <span id="userInitial">C</span>
    </div>

    <div class="user-info">
      <h2>ChatOpen</h2>
      <span id="onlineStatus">En ligne</span>
    </div>

  </div>

  <div class="top-actions">

    <button class="icon-btn" id="searchBtn" aria-label="Rechercher">
      🔍
    </button>

    <button class="icon-btn" id="menuBtn" aria-label="Menu">
      ⋮
    </button>

  </div>

</header>


<!-- RECHERCHE -->
<div class="search-box" id="searchBox">

  <input
    type="search"
    id="searchInput"
    placeholder="Rechercher une personne..."
    autocomplete="off"
  >

</div>


<!-- LISTE DES DISCUSSIONS -->
<main class="conversation-list" id="conversationList">

  <div class="empty-state" id="emptyState">

    <div class="empty-icon">
      💬
    </div>

    <h3>Aucune discussion</h3>

    <p>
      Commence une nouvelle conversation
      avec quelqu'un sur ChatOpen.
    </p>

    <button class="new-chat-btn" id="newChatBtn">
      Nouvelle discussion
    </button>

  </div>

</main>


<!-- BOUTON NOUVELLE DISCUSSION -->
<button
  class="floating-btn"
  id="floatingNewChat"
  aria-label="Nouvelle discussion"
>
  +
</button>


<!-- NAVIGATION -->
<nav class="bottom-nav">

  <button class="nav-item active">

    <span class="nav-icon">💬</span>
    <span>Discussions</span>

  </button>

  <button class="nav-item" id="contactsBtn">

    <span class="nav-icon">👥</span>
    <span>Contacts</span>

  </button>

  <button class="nav-item" id="profileBtn">

    <span class="nav-icon">👤</span>
    <span>Profil</span>

  </button>

  <button class="nav-item" id="settingsBtn">

    <span class="nav-icon">⚙️</span>
    <span>Réglages</span>

  </button>

</nav>

  </div>  <!-- MENU -->  <div class="menu-overlay" id="menuOverlay"><div class="side-menu">

  <button id="closeMenu" class="close-menu">
    ×
  </button>

  <h2>ChatOpen</h2>

  <button>
    👤 Mon profil
  </button>

  <button>
    🎨 Thème des discussions
  </button>

  <button>
    🔔 Notifications
  </button>

  <button>
    🔒 Confidentialité
  </button>

  <button>
    ⚙️ Réglages
  </button>

</div>

  </div>  <script type="module" src="js/chat.js"></script></body></html>
