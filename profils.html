<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Profil - ChatOpen</title>

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <header class="topbar">

    <div class="brand">
      <div class="logo small">C</div>
      <span>ChatOpen</span>
    </div>

    <a href="chat.html" class="btn">
      Retour au chat
    </a>

  </header>


  <main class="profile-page">

    <section class="card profile-card">

      <div id="profileAvatar" class="profile-avatar">
        C
      </div>

      <h1 id="profileUsername">
        Chargement...
      </h1>

      <p id="profileEmail" class="muted">
        Chargement...
      </p>

      <div class="profile-info">

        <div class="info-item">
          <span>Nom d'utilisateur</span>
          <strong id="profileName">...</strong>
        </div>

        <div class="info-item">
          <span>Identifiant ChatOpen</span>
          <strong id="profileId">...</strong>
        </div>

      </div>

      <button id="logoutButton" class="btn full">
        Se déconnecter
      </button>

    </section>

  </main>


  <script type="module" src="js/profil.js"></script>

</body>

</html>
