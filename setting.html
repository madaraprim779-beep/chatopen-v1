<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paramètres - ChatOpen</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <main class="page">

    <a href="chat.html" class="back">← Retour</a>

    <div class="card settings-card">

      <h1>Paramètres</h1>
      <p class="muted">
        Configure ton expérience ChatOpen.
      </p>

      <div class="setting">
        <div>
          <strong>🔔 Notifications</strong>
          <span>Gérer les notifications</span>
        </div>
      </div>

      <div class="setting">
        <div>
          <strong>🔒 Confidentialité</strong>
          <span>Gérer la confidentialité</span>
        </div>
      </div>

      <div class="setting">
        <div>
          <strong>🌙 Apparence</strong>
          <span>Thème de l'application</span>
        </div>
      </div>

      <button id="logout" class="danger full">
        Se déconnecter
      </button>

    </div>

  </main>

  <script type="module" src="js/settings.js"></script>

</body>
</html>
