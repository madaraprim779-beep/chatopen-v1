<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Connexion — ChatOpen</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="welcome">

        <div class="logo">💬</div>

        <h1>Bienvenue</h1>

        <p>Connecte-toi à ton compte ChatOpen</p>

        <form id="loginForm" class="buttons">

            <input
                type="email"
                id="email"
                placeholder="Adresse e-mail"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Mot de passe"
                required
            >

            <button type="submit" class="btn login">
                Se connecter
            </button>

        </form>

        <p>
            Pas encore de compte ?
            <a href="register.html">Créer un compte</a>
        </p>

    </div>

    <script src="js/auth.js"></script>

</body>
</html>
