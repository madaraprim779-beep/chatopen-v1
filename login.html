<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Connexion - ChatOpen</title>

    <link rel="stylesheet" href="CSS/style.css">
</head>

<body>

    <main class="auth-container">

        <div class="auth-box">

            <div class="logo">
                💬 ChatOpen
            </div>

            <h1>Connexion</h1>

            <p>Connecte-toi avec ton numéro ChatOpen</p>

            <form id="loginForm">

                <label for="chatopenNumber">
                    Numéro ChatOpen
                </label>

                <input
                    type="text"
                    id="chatopenNumber"
                    name="chatopenNumber"
                    placeholder="Ex : 704 582 193"
                    inputmode="numeric"
                    maxlength="11"
                    required
                >

                <label for="password">
                    Mot de passe
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Ton mot de passe"
                    autocomplete="current-password"
                    required
                >

                <button type="submit">
                    Se connecter
                </button>

            </form>

            <p class="auth-link">
                Pas encore de compte ?
                <a href="register.html">
                    Créer un compte
                </a>
            </p>

            <a href="index.html" class="back-link">
                ← Retour à l'accueil
            </a>

        </div>

    </main>

    <script src="JS/app.js"></script>

</body>
</html>
