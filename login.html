<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion - ChatOpen</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <main class="auth">
    <div class="card">
      <div class="logo small">C</div>

      <h1>Connexion</h1>
      <p class="muted">Connecte-toi à ton compte ChatOpen.</p>

      <form id="loginForm">
        <input id="username" type="text" placeholder="Nom d'utilisateur" required>

        <input id="password" type="password" placeholder="Mot de passe" required>

        <button class="btn full" type="submit">
          Se connecter
        </button>

        <p id="error" class="error"></p>
      </form>

      <p class="bottom-text">
        Pas encore de compte ?
        <a href="register.html">Créer un compte</a>
      </p>
    </div>
  </main>

  <script type="module" src="js/login.js"></script>
</body>
</html>
